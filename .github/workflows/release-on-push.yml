name: Release on push

on:
  push:
    branches:
      - main

# The release script creates a tag and uploads assets with `gh`.
permissions:
  contents: write

# Run every push in order so two commits cannot choose the same next version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Choose next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_version=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              latest_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          if [[ -n "$latest_version" ]]; then
            IFS=. read -r major minor patch <<< "$latest_version"
            version="${major}.${minor}.$((patch + 1))"
          else
            version="0.1.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Build DMGs and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}" --yes
