name: Release on push

on:
  push:
    branches:
      - main

# The release script creates a tag and uploads assets with `gh`.
permissions:
  contents: write

# Run every push in order so two commits cannot choose the same next version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GlassCard uses the macOS 26 SwiftUI glassEffect API. The deployment
    # target remains macOS 14, but compiling that guarded code requires SDK 26.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify build toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"

          swift_major="$(swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p' | head -1)"
          if [[ -z "$swift_major" || "$swift_major" -lt 6 ]]; then
            echo "Swift 6 or newer is required, but the selected runner provides Swift ${swift_major:-unknown}." >&2
            exit 1
          fi

          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ || "$sdk_major" -lt 26 ]]; then
            echo "macOS SDK 26 or newer is required for SwiftUI glassEffect; found $sdk_version." >&2
            exit 1
          fi

      - name: Choose next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Honor an explicit release tag on this commit.
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "Publishing v$version"
              exit 0
            fi
          done < <(git tag --points-at HEAD --list 'v*' --sort=-version:refname)

          latest_version=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              latest_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          # Start the stable release line at 1.0.0, then increment patches.
          version="1.0.0"
          if [[ -n "$latest_version" ]]; then
            IFS=. read -r major minor patch <<< "$latest_version"
            if (( major >= 1 )); then
              version="${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Select signing mode
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && \
                -n "$NOTARY_APPLE_ID" && -n "$NOTARY_TEAM_ID" && -n "$NOTARY_PASSWORD" ]]; then
            echo "TASKTICK_SIGNING_MODE=signed" >> "$GITHUB_ENV"
            echo "Developer ID credentials found; release will be signed and notarized."
          else
            echo "TASKTICK_SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "::warning::Developer ID/notarization credentials are incomplete. Publishing ad-hoc DMGs; users may need to approve them in Gatekeeper."
          fi

      - name: Import Developer ID certificate
        if: env.TASKTICK_SIGNING_MODE == 'signed'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/tasktick-signing.keychain-db"
          certificate="$RUNNER_TEMP/tasktick-developer-id.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          : "${identity:?Imported certificate does not contain a Developer ID Application identity}"
          echo "DEVELOPER_ID_APPLICATION=$identity" >> "$GITHUB_ENV"

      - name: Build DMGs and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          args=("${{ steps.version.outputs.version }}" --yes)
          if [[ "$TASKTICK_SIGNING_MODE" == "adhoc" ]]; then
            args+=(--ad-hoc)
          fi
          ./scripts/release.sh "${args[@]}"
