name: Release on push

on:
  push:
    branches:
      - main

# The release script creates a tag and uploads assets with `gh`.
permissions:
  contents: write

# Run every push in order so two commits cannot choose the same next version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GlassCard uses the macOS 26 SwiftUI glassEffect API. The deployment
    # target remains macOS 14, but compiling that guarded code requires SDK 26.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify build toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"

          swift_major="$(swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p' | head -1)"
          if [[ -z "$swift_major" || "$swift_major" -lt 6 ]]; then
            echo "Swift 6 or newer is required, but the selected runner provides Swift ${swift_major:-unknown}." >&2
            exit 1
          fi

          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ || "$sdk_major" -lt 26 ]]; then
            echo "macOS SDK 26 or newer is required for SwiftUI glassEffect; found $sdk_version." >&2
            exit 1
          fi

      - name: Choose next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Honor an explicit release tag on this commit.
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "Publishing v$version"
              exit 0
            fi
          done < <(git tag --points-at HEAD --list 'v*' --sort=-version:refname)

          latest_version=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              latest_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          # Start the stable release line at 1.0.0, then increment patches.
          version="1.0.0"
          if [[ -n "$latest_version" ]]; then
            IFS=. read -r major minor patch <<< "$latest_version"
            if (( major >= 1 )); then
              version="${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Build DMGs and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}" --yes
