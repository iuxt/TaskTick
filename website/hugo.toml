baseURL = 'https://iuxt.github.io/TaskTick/'
title = 'TaskTick'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']

[languages.zh]
locale = 'zh-CN'
label = '简体中文'
weight = 1
title = 'TaskTick — 让 Mac 按你的计划运行'

[languages.en]
locale = 'en-US'
label = 'English'
weight = 2
title = 'TaskTick — A little automation. A lot more time.'

[params]
repository = 'https://github.com/iuxt/TaskTick'
download = 'https://github.com/iuxt/TaskTick/releases/latest'

[module]
[[module.mounts]]
source = 'static'
target = 'static'
[[module.mounts]]
source = '../docs/guide'
target = 'static/guide'
[[module.mounts]]
source = '../docs/icon.png'
target = 'static/icon.png'

[caches.images]
dir = ':cacheDir/images'
